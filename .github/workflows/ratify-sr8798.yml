name: Ratify SR-8798 — Random.swift validation on a built stdlib

# Run #2 configuration, per PREFLIGHT-RUN2.md (the post-PR
# review's pre-flight checklist, completed before this run):
#
# - Runner: macos-26-intel — x86_64, 4 CPU / 14 GB, a standard
#   GitHub-hosted label. x86_64 matters: Random.swift guards
#   its Float80 cases to i386/x86_64, so this run witnesses
#   Float80 as well as Float and Double. Run #1 used the bare
#   macos-26 label (arm64), which could not.
# - Build scope, decided rather than inherited: --release
#   (Release variant of everything; Run #1 used the
#   RelWithDebInfo default) and --no-assertions (Run #1 had
#   assertions on). Both flags verified against this tree's
#   utils/build_swift driver arguments. The validation file's
#   checks do not depend on assertions or debug info.
# - Run #1 failed environmentally at 99% of the build
#   (temp-write I/O error building swift-plugin-server) and
#   never reached the validation file. Full record:
#   sr-8798-ratify/RUN-RECORD.md in the exercise notes.
#
# Trigger design (unchanged from Run #1): pushing this file
# to the fix branch fires it (the paths filter keeps later
# code-only pushes from re-running a multi-hour build;
# editing this file re-fires it). Manual runs via
# workflow_dispatch. Fork-only; nothing here goes upstream.

on:
  push:
    branches: [fix/sr-8798-wide-range-random]
    paths: ['.github/workflows/ratify-sr8798.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ratify:
    name: Build stdlib, run Random.swift validation
    runs-on: macos-26-intel
    timeout-minutes: 355
    steps:
      - name: Check out the fix branch as swift/
        uses: actions/checkout@v4
        with:
          ref: fix/sr-8798-wide-range-random
          path: swift

      - name: Fetch sibling repositories
        run: ./swift/utils/update-checkout --clone --scheme main --skip-history

      - name: Install build tools (repo Brewfile + cmake)
        working-directory: swift
        run: |
          brew bundle
          command -v cmake >/dev/null || brew install cmake

      - name: Build the toolchain (release, no assertions)
        working-directory: swift
        run: ./utils/build-script --release --no-assertions --skip-build-benchmarks

      - name: Run the Random.swift validation file
        run: |
          BUILD_DIR="$(find "$GITHUB_WORKSPACE/build" -maxdepth 2 -type d -name 'swift-macosx-*' | head -n 1)"
          echo "build dir: $BUILD_DIR"
          set -o pipefail
          ./swift/utils/run-test --build-dir "$BUILD_DIR" \
            "$GITHUB_WORKSPACE/swift/validation-test/stdlib/Random.swift" \
            2>&1 | tee "$GITHUB_WORKSPACE/ratify.log"

      - name: Upload the lit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratify-log
          path: ratify.log
